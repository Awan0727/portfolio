    <style>
        :root {
            --bg: #010409;
            --accent: #00f2ff;
            --card-bg: rgba(13, 17, 23, 0.9);
            --border: rgba(0, 242, 255, 0.3);
            --text-gray: #8b949e;
        }

        body {
            background-color: var(--bg);
            color: #ffffff;
            margin: 0;
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
        }

        /* HIGH-VISIBILITY GRID OVERLAY */
        .grid-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: -1;
            opacity: 0.25;
        }

        .container { max-width: 1050px; margin: 0 auto; padding: 20px; }

        /* HEADER WITH WAVE */
        header {
            position: relative;
            background: linear-gradient(180deg, #0a192f 0%, #010409 100%);
            padding: 80px 20px 120px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            border-radius: 0 0 40px 40px;
            overflow: hidden;
        }

        h1 {
            font-family: 'Quicksand', sans-serif;
            font-size: 3.5rem;
            margin: 0;
            color: #fff;
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.5);
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 10px;
            font-weight: 600;
        }

        .waves {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
        }

            animation: move-forever 25s cubic-bezier(.55,.5,.45,.5) infinite;
        }
