<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammed Abdul Awan | SOC Security Operations</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #020408;
            --card-bg: rgba(13, 17, 23, 0.95);
            --accent-cyan: #00f2ff;
            --terminal-green: #00ff41;
            --text-main: #e6edf3;
            --glow: 0 0 20px rgba(0, 242, 255, 0.4);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            background-image: linear-gradient(rgba(0, 242, 255, 0.05) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(0, 242, 255, 0.05) 1px, transparent 1px);
            background-size: 45px 45px;
        }

        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }

        header {
            text-align: center;
            padding: 80px 20px;
            border-bottom: 1px solid rgba(0, 242, 255, 0.2);
        }

        .status-bar {
            font-family: 'Courier New', monospace;
            color: var(--terminal-green);
            background: rgba(0, 255, 65, 0.1);
            padding: 5px 15px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid var(--terminal-green);
        }

        h1 { font-size: 3.2rem; margin: 10px 0; text-transform: uppercase; letter-spacing: 3px; text-shadow: var(--glow); }
        .tagline { color: var(--accent-cyan); font-weight: 300; font-size: 1.3rem; letter-spacing: 2px; }

        .cyber-grid { display: grid; grid-template-columns: 2.5fr 1fr; gap: 30px; margin-top: 50px; }

        .section-title {
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
            border-left: 4px solid var(--accent-cyan);
            padding-left: 15px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 242, 255, 0.1);
            padding: 25px;
            transition: 0.3s;
        }

        .card:hover { border-color: var(--accent-cyan); box-shadow: var(--glow); }

        /* FIXED IMAGE SECTION */
        .project-details {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 25px;
            margin-top: 20px;
        }

        .project-visual {
            background: #000;
            border: 1px solid var(--accent-cyan);
            border-radius: 4px;
            overflow: hidden;
            height: 220px;
            position: relative;
        }

        .project-visual img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .ops-tags { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px;}
        .ops-tag {

            color: var(--terminal-green);
            font-size: 0.8rem;
