<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammed Abdul Awan | SOC Security Specialist</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&family=Outfit:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-navy: #020617;
            --cyber-cyan: #00f2ff;
            --slate-panel: rgba(15, 23, 42, 0.9);
            --console-border: rgba(0, 242, 255, 0.35);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }

        body {
            background-color: var(--deep-navy);
            color: var(--text-main);
            margin: 0;
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* PERSONAL WATERMARK LAYER - Looking for image_3.png */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('image_3.png') no-repeat center/cover; 
            z-index: -2;
            opacity: 0.18; 
            filter: grayscale(1) brightness(0.7);
            pointer-events: none;
        }

        /* CYBER GRID LAYER */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--console-border) 1px, transparent 1px),
                linear-gradient(90deg, var(--console-border) 1px, transparent 1px);
            background-size: 45px 45px;
            z-index: -1;
            opacity: 0.2;
            pointer-events: none;
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; position: relative; z-index: 10; }

        header {
            text-align: center;
            padding: 60px 20px 110px;
            background: var(--slate-panel);
            border: 1px solid var(--console-border);
            border-radius: 30px;
            backdrop-filter: blur(8px);
            position: relative;
            overflow: hidden;
        }

        h1 {
            font-family: 'Quicksand', sans-serif;
            font-size: clamp(2.2rem, 7vw, 3.5rem);
            margin: 0;
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.5);
        }

        .role-badge {
            font-size: 1.1rem;
            color: var(--cyber-cyan);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 10px;
            font-weight: 600;
        }

        /* THE WAVES */
        .wave-container {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 70px;
            line-height: 0;
        }
        .waves { width: 100%; height: 100%; }
        .parallax > use { animation: move-forever 20s cubic-bezier(.55,.5,.45,.5) infinite; }
        .parallax > use:nth-child(1) { animation-delay: -2s; fill: rgba(0, 242, 255, 0.2); }
        .parallax > use:nth-child(2) { animation-delay: -4s; fill: rgba(0, 242, 255, 0.4); }
        @keyframes move-forever { 0% { transform: translate3d(-90px,0,0); } 100% { transform: translate3d(85px,0,0); } }

        .hud-pills { display: flex; justify-content: center; gap: 12px; margin-top: 30px; flex-wrap: wrap; }
        .pill { 
            background: rgba(0, 242, 255, 0.05); border: 1px solid var(--console-border); 
            padding: 10px 20px; border-radius: 50px; color: #fff; 
            text-decoration: none; font-size: 0.85rem; transition: 0.3s;
            display: flex; align-items: center; gap: 8px;
        }
        .pill:hover { background: var(--cyber-cyan); color: #000; box-shadow: 0 0 15px var(--cyber-cyan); }

        .section-header {
            font-family: 'Quicksand', sans-serif;
            color: var(--cyber-cyan);
            font-size: 1.6rem;
            margin: 50px 0 20px;
            border-left: 4px solid var(--cyber-cyan);
            padding-left: 15px;
        }

        .card {
            background: var(--slate-panel);
            border: 1px solid var(--console-border);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(8px);
        }

        .card-body { padding: 35px; }

        .btn-git {
            display: inline-flex; align-items: center; gap: 10px;
            margin-top: 20px; padding: 12px 25px;
            background: var(--cyber-cyan); color: #000;
            text-decoration: none; font-weight: bold; border-radius: 6px;
        }

        .intel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 30px; }
        .intel-panel { 
            background: var(--slate-panel); padding: 25px; border-radius: 20px; 
            border: 1px solid var(--console-border); backdrop-filter: blur(8px);
        }
        
        h3 { color: var(--cyber-cyan); font-family: 'Quicksand', sans-serif; margin-top: 0; font-size: 1.3rem; }
        
        ul { list-style: none; padding: 0; }
        ul li { margin-bottom: 10px; font-size: 0.95rem; color: #e2e8f0; display: flex; align-items: flex-start; gap: 10px; }
        ul li::before { content: "▹"; color: var(--cyber-cyan); font-weight: bold; }

        .tech-tag { font-family: 'JetBrains Mono', monospace; color: var(--cyber-cyan); background: rgba(0, 242, 255, 0.1); padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; display: inline-block; margin: 3px; }

        footer {
            margin-top: 80px; padding: 40px 20px; text-align: center; 
            border-top: 1px solid var(--console-border); font-family: 'JetBrains Mono', monospace;
        }

        .footer-text { font-size: 0.85rem; color: #64748b; letter-spacing: 1px; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Mohammed Abdul Awan</h1>
        <div class="role-badge">Cyber Defense & SOC Analyst</div>

            <a href="mailto:mohmmedabdulawan@gmail.com" class="pill"><i class="fas fa-envelope"></i> Email</a>
